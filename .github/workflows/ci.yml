name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify issue and API contracts
        shell: pwsh
        run: |
          ./tests/contracts/verify-issue-register.ps1
          ./tests/contracts/verify-api-v1.ps1
          ./tests/contracts/verify-injection-safety.ps1
          ./tests/contracts/verify-core-safety.ps1
          ./tests/contracts/verify-core-runtime.ps1
          ./tests/contracts/verify-host-snapshot.ps1
          ./tests/contracts/verify-host-session.ps1
          ./tests/contracts/verify-rpc-session.ps1
          ./tests/contracts/verify-named-pipe.ps1
          ./tests/contracts/verify-platform-safety.ps1
          ./tests/contracts/verify-offset-discovery.ps1
          ./tests/contracts/verify-transport-cutover.ps1
          ./tests/contracts/verify-type-commands.ps1
          Get-Content ./protocol/v1/protocol.json -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
          Get-Content ./protocol/v1/schema/payload.schema.json -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Core DLL
        shell: pwsh
        run: >-
          msbuild ./Dumper/UExplorerCore.vcxproj
          /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          /m:1 /v:minimal

      - name: Verify release Core transport imports
        shell: pwsh
        run: ./tests/contracts/verify-transport-cutover.ps1 -DllPath ./Dumper/x64/Release/UExplorerCore.dll

      - name: Build Core harness
        shell: pwsh
        run: >-
          msbuild ./tests/core-harness/CoreHarness.vcxproj
          /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          /m:1 /v:minimal

      - name: Run Core harness
        shell: pwsh
        run: ./tests/core-harness/x64/Release/CoreHarness.exe ./protocol/v1/fixtures

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust quality components
        shell: pwsh
        run: rustup component add rustfmt clippy

      - name: Check formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path ./frontend/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path ./protocol/rust/Cargo.toml -- --check
          cargo fmt --manifest-path ./tests/fake-core/Cargo.toml -- --check

      - name: Run Clippy
        shell: pwsh
        run: |
          cargo clippy --manifest-path ./frontend/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path ./protocol/rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ./tests/fake-core/Cargo.toml --all-targets -- -D warnings

      - name: Configure MSBuild for cross-language fixture
        uses: microsoft/setup-msbuild@v3

      - name: Build real C++ Core fixture for Rust Host
        shell: pwsh
        run: >-
          msbuild ./tests/core-harness/CoreHarness.vcxproj
          /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          /m:1 /v:minimal

      - name: Build live injection fixtures
        shell: pwsh
        run: |
          msbuild ./tests/injection-fixture/InjectionTarget.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m:1 /v:minimal
          msbuild ./tests/injection-fixture/InjectionTarget.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m:1 /v:minimal
          msbuild ./tests/injection-fixture/InjectionCoreFixture.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m:1 /v:minimal
          msbuild ./tests/injection-fixture/InjectionCoreFixture.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m:1 /v:minimal
          msbuild ./tests/injection-fixture/InjectionCoreFixture.vcxproj /p:Configuration=Slow /p:Platform=x64 /p:PlatformToolset=v143 /m:1 /v:minimal
          msbuild ./tests/injection-fixture/InjectionCoreFixture.vcxproj /p:Configuration=Reject /p:Platform=x64 /p:PlatformToolset=v143 /m:1 /v:minimal

      - name: Run Rust tests
        shell: pwsh
        run: |
          cargo test --manifest-path ./frontend/src-tauri/Cargo.toml
          cargo test --manifest-path ./frontend/src-tauri/Cargo.toml --features cross-language-fixture --test core_process_fixture
          cargo test --manifest-path ./frontend/src-tauri/Cargo.toml --features cross-language-fixture --test injection_process_fixture
          cargo test --manifest-path ./protocol/rust/Cargo.toml
          cargo test --manifest-path ./tests/fake-core/Cargo.toml
